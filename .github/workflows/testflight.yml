# Uploads a Release build of main to TestFlight with scripts/testflight.sh, the same script as
# `make testflight` on a Mac. Started by hand only, so pull requests and pushes never upload:
#   gh workflow run testflight.yml --ref main
# Needs the repository secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY_B64, which the
# owner sets (docs/app-store-connect.md).
name: TestFlight

on:
  workflow_dispatch:

# One upload at a time, so two runs can't take the same build number.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  upload:
    name: Upload to TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen and asc
        run: |
          brew install xcodegen asc
          asc --version
      - name: Write the API key
        env:
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode >"$RUNNER_TEMP/AuthKey.p8"
      - name: Archive, upload and add to the internal group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: scripts/testflight.sh
      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
