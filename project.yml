# Source of truth for the Xcode project. Run `make project` to regenerate RideOrNah.xcodeproj.
name: RideOrNah

options:
  createIntermediateGroups: true

packages:
  RideOrNahKit:
    path: Packages/RideOrNahKit

targets:
  RideOrNah:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: RideOrNah
      # The widget and watch views, so app-hosted tests can render them.
      - path: Widgets/Views
      - path: Watch/Shared
    dependencies:
      - target: RideOrNahWidgets
      - target: RideOrNahWatch
      - package: RideOrNahKit
        product: SharedContainer
      - package: RideOrNahKit
        product: VerdictEngine
      - package: RideOrNahKit
        product: WeatherData
      - package: RideOrNahKit
        product: RiderSettings
      - package: RideOrNahKit
        product: Presentation
      - package: RideOrNahKit
        product: Entitlements
    entitlements:
      path: RideOrNah/RideOrNah.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
        com.apple.developer.weatherkit: true
    info:
      path: RideOrNah/Info.plist
      properties:
        CFBundleDisplayName: RideOrNah
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        RideOrNahAppGroup: $(APP_GROUP_IDENTIFIER)
        NSLocationWhenInUseUsageDescription: Ride or Nah uses your location only to check the weather where you ride. It's rounded to about a kilometre and sent only to Apple Weather.
        NSLocationDefaultAccuracyReduced: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - rideornah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).rideornah
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  # Home Screen and Lock Screen widgets, reading the app's cache, settings and access mirror.
  RideOrNahWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Widgets
      - path: RideOrNah/DesignSystem
    dependencies:
      - package: RideOrNahKit
        product: SharedContainer
      - package: RideOrNahKit
        product: VerdictEngine
      - package: RideOrNahKit
        product: WeatherData
      - package: RideOrNahKit
        product: RiderSettings
      - package: RideOrNahKit
        product: Presentation
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/RideOrNahWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
        com.apple.developer.weatherkit: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Ride or Nah
        RideOrNahAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).rideornah.widgets
        TARGETED_DEVICE_FAMILY: "1"

  # The Apple Watch app, fed by results the iPhone evaluates. It never fetches weather.
  RideOrNahWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Watch/App
      - path: Watch/Shared
      - path: RideOrNah/DesignSystem
      - path: RideOrNah/Weather/WeatherAttributionView.swift
    dependencies:
      - target: RideOrNahWatchWidgets
      - package: RideOrNahKit
        product: Presentation
      - package: RideOrNahKit
        product: VerdictEngine
      - package: RideOrNahKit
        product: WeatherData
    entitlements:
      path: Watch/App/RideOrNahWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: Watch/App/Info.plist
      properties:
        CFBundleDisplayName: Ride or Nah
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).rideornah
        RideOrNahAppGroup: $(APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).rideornah.watchkitapp
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  # Watch-face complications, reading the results the watch app stored.
  RideOrNahWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Watch/Complications
      - path: Watch/Shared
      - path: RideOrNah/DesignSystem
      - path: RideOrNah/Weather/WeatherAttributionView.swift
    dependencies:
      - package: RideOrNahKit
        product: Presentation
      - package: RideOrNahKit
        product: VerdictEngine
      - package: RideOrNahKit
        product: WeatherData
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Watch/Complications/RideOrNahWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: Watch/Complications/Info.plist
      properties:
        CFBundleDisplayName: Ride or Nah
        RideOrNahAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).rideornah.watchkitapp.widgets

  # Unit tests hosted in the app, for checks that need the built app bundle.
  RideOrNahTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: RideOrNahTests
      # StoreKit Testing loads it from the test bundle (SKTestSession).
      - path: StoreKit/RideOrNah.storekit
        buildPhase: resources
    dependencies:
      - target: RideOrNah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).rideornah.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  RideOrNahUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: RideOrNahUITests
    dependencies:
      - target: RideOrNah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).rideornah.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RideOrNah:
    build:
      targets:
        RideOrNah: all
    # Local StoreKit testing: the two plans with placeholder prices. App Store Connect sets the real ones.
    run:
      storeKitConfiguration: StoreKit/RideOrNah.storekit
    test:
      targets:
        - RideOrNahTests
        - RideOrNahUITests
  # Runs UI tests against a Release build (`make test-release`), to check debug-only code is gone.
  RideOrNahRelease:
    build:
      targets:
        RideOrNah: all
    test:
      config: Release
      targets:
        - RideOrNahUITests
