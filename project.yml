# Source of truth for the Xcode project. Run `make project` to regenerate RideOrNah.xcodeproj.
name: RideOrNah

options:
  createIntermediateGroups: true

packages:
  RideOrNahKit:
    path: Packages/RideOrNahKit

targets:
  RideOrNah:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: RideOrNah
      # The widget and watch views, so app-hosted tests can render them.
      - path: Widgets/Views
      - path: Watch/Shared
    dependencies:
      - target: RideOrNahWidgets
      - target: RideOrNahWatch
      - package: RideOrNahKit
        product: SharedContainer
      - package: RideOrNahKit
        product: VerdictEngine
      - package: RideOrNahKit
        product: WeatherData
      - package: RideOrNahKit
        product: RiderSettings
      - package: RideOrNahKit
        product: Presentation
      - package: RideOrNahKit
        product: Entitlements
    entitlements:
      path: RideOrNah/RideOrNah.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
        com.apple.developer.weatherkit: true
    info:
      path: RideOrNah/Info.plist
      properties:
        CFBundleDisplayName: Ride or Nah
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only HTTPS through Apple's frameworks, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        RideOrNahAppGroup: $(APP_GROUP_IDENTIFIER)
        NSLocationWhenInUseUsageDescription: Ride or Nah uses your location only to check the weather where you ride. It's rounded to about a kilometre and sent only to Apple Weather.
        NSLocationDefaultAccuracyReduced: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - rideornah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Home Screen and Lock Screen widgets, reading the app's cache, settings and access mirror.
  RideOrNahWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Widgets
      - path: RideOrNah/DesignSystem
    dependencies:
      - package: RideOrNahKit
        product: SharedContainer
      - package: RideOrNahKit
        product: VerdictEngine
      - package: RideOrNahKit
        product: WeatherData
      - package: RideOrNahKit
        product: RiderSettings
      - package: RideOrNahKit
        product: Presentation
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/RideOrNahWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
        com.apple.developer.weatherkit: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Ride or Nah
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        RideOrNahAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Widgets
        TARGETED_DEVICE_FAMILY: "1"

  # The Apple Watch app, fed by results the iPhone evaluates. It never fetches weather.
  RideOrNahWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Watch/App
      - path: Watch/Shared
      - path: RideOrNah/DesignSystem
      - path: RideOrNah/Weather/WeatherAttributionView.swift
    dependencies:
      - target: RideOrNahWatchWidgets
      - package: RideOrNahKit
        product: Presentation
      - package: RideOrNahKit
        product: VerdictEngine
      - package: RideOrNahKit
        product: WeatherData
    entitlements:
      path: Watch/App/RideOrNahWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: Watch/App/Info.plist
      properties:
        CFBundleDisplayName: Ride or Nah
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        RideOrNahAppGroup: $(APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Watch-face complications, reading the results the watch app stored.
  RideOrNahWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Watch/Complications
      - path: Watch/Shared
      - path: RideOrNah/DesignSystem
      - path: RideOrNah/Weather/WeatherAttributionView.swift
    dependencies:
      - package: RideOrNahKit
        product: Presentation
      - package: RideOrNahKit
        product: VerdictEngine
      - package: RideOrNahKit
        product: WeatherData
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Watch/Complications/RideOrNahWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: Watch/Complications/Info.plist
      properties:
        CFBundleDisplayName: Ride or Nah
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        RideOrNahAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp.Widgets

  # UI tests of the watch app on a watch simulator, fed sample results instead of an iPhone.
  RideOrNahWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: RideOrNahWatchUITests
    dependencies:
      - target: RideOrNahWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp.UITests
        GENERATE_INFOPLIST_FILE: YES

  # Unit tests hosted in the app, for checks that need the built app bundle.
  RideOrNahTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: RideOrNahTests
      # StoreKit Testing loads it from the test bundle (SKTestSession).
      - path: StoreKit/RideOrNah.storekit
        buildPhase: resources
    dependencies:
      - target: RideOrNah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  RideOrNahUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: RideOrNahUITests
    dependencies:
      - target: RideOrNah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).UITests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RideOrNah:
    build:
      targets:
        RideOrNah: all
    # Local StoreKit testing: the two plans with placeholder prices. App Store Connect sets the real ones.
    run:
      storeKitConfiguration: StoreKit/RideOrNah.storekit
    test:
      targets:
        - RideOrNahTests
        - RideOrNahUITests
  # The watch app's UI tests (`make test-watch`), on a watch simulator.
  RideOrNahWatch:
    build:
      targets:
        RideOrNahWatch: all
    test:
      targets:
        - RideOrNahWatchUITests
  # Runs UI tests against a Release build (`make test-release`), to check debug-only code is gone.
  RideOrNahRelease:
    build:
      targets:
        RideOrNah: all
    test:
      config: Release
      targets:
        - RideOrNahUITests
