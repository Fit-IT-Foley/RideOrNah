# Source of truth for the Xcode project. Run `make project` to regenerate RideOrNah.xcodeproj.
name: RideOrNah

options:
  createIntermediateGroups: true

packages:
  RideOrNahKit:
    path: Packages/RideOrNahKit

targets:
  RideOrNah:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: RideOrNah
    dependencies:
      - package: RideOrNahKit
        product: SharedContainer
      - package: RideOrNahKit
        product: VerdictEngine
      - package: RideOrNahKit
        product: WeatherData
      - package: RideOrNahKit
        product: RiderSettings
      - package: RideOrNahKit
        product: Presentation
    entitlements:
      path: RideOrNah/RideOrNah.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
        com.apple.developer.weatherkit: true
    info:
      path: RideOrNah/Info.plist
      properties:
        CFBundleDisplayName: RideOrNah
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        RideOrNahAppGroup: $(APP_GROUP_IDENTIFIER)
        NSLocationWhenInUseUsageDescription: Ride or Nah uses your location only to check the weather where you ride. It's rounded to about a kilometre and sent only to Apple Weather.
        NSLocationDefaultAccuracyReduced: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).rideornah
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  # Unit tests hosted in the app, for checks that need the built app bundle.
  RideOrNahTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: RideOrNahTests
    dependencies:
      - target: RideOrNah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).rideornah.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  RideOrNahUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: RideOrNahUITests
    dependencies:
      - target: RideOrNah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).rideornah.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RideOrNah:
    build:
      targets:
        RideOrNah: all
    test:
      targets:
        - RideOrNahTests
        - RideOrNahUITests
  # Runs UI tests against a Release build (`make test-release`), to check debug-only code is gone.
  RideOrNahRelease:
    build:
      targets:
        RideOrNah: all
    test:
      config: Release
      targets:
        - RideOrNahUITests
